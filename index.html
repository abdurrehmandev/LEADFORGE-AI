        try {
          if (typeof window !== 'undefined') {
            var origFetch = window.fetch;
            var activeFetch = origFetch ? function() { return origFetch.apply(window, arguments); } : undefined;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch;
              },
              set: function(newFetch) {
                activeFetch = newFetch;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Property descriptor fallback
        }
      })();
